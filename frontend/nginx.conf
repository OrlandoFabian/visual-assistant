server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses. Skip SSE (text/event-stream) because
    # compressing a long-lived stream buffers chunks and defeats
    # real-time delivery.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Proxy API calls to the backend container.
    # Trailing slash on proxy_pass strips the /api/ prefix.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE support: no buffering, long read timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # SPA fallback: unknown paths serve index.html so React Router can route them
    location / {
        try_files $uri $uri/ /index.html;
    }
}
